# CI cho «Học cùng SAM» (WAL-163).
#
# PHẠM VI CỐ Ý HẸP: chỉ static analysis + unit/widget test.
# KHÔNG build APK/IPA, KHÔNG ký, KHÔNG deploy, KHÔNG secrets, KHÔNG matrix OS.
#
# VÌ SAO CỔNG NÀY ĐÁNG CÓ, dù suite vẫn chạy được ở máy:
# suite này chở các LUẬT BẤT BIẾN của sản phẩm, thứ vỡ ÂM THẦM chứ không
# crash — không %/điểm/XP/streak trong UI của trẻ, không SDK quảng cáo trong
# pubspec, PAYMENT ≠ LEARNING TRUTH, không bịa trích dẫn SGK, corpus không lọt
# vào repo. Ở máy thì «nhớ chạy»; ở đây thì không merge được nếu vỡ.
#
# Lịch sử: repo private của tài khoản này từng KHÔNG chạy được Actions —
# job chết ở giây thứ 3, không step nào, annotation «The job was not started
# because recent account payments have failed or your spending limit needs to
# be increased». Đó là chặn thanh toán, không phải hết phút (repo public cùng
# tài khoản vẫn xanh). Blocker tháo ngày 2026-09-03.
name: CI

# Chạy ở hai chỗ có giá trị thật: `main` (thứ sẽ phát hành) và Pull Request
# (thứ cần review). Nhánh chưa mở PR không chạy — mọi lần merge đều đã qua
# analyze + toàn bộ test ở máy, nên đây là bỏ một lớp TRÙNG, không bỏ kiểm chứng.
#
# ⭐ `pull_request` CỐ Ý KHÔNG có `paths-ignore`.
#
# Từ 2026-09-03 `main` bật branch protection với check bắt buộc «Analyze & Test»
# (Founder D1). GitHub coi «job không chạy» KHÁC «job đã pass»: một PR chỉ sửa
# tài liệu sẽ không sinh check nào, nên check bắt buộc treo PENDING VĨNH VIỄN và
# PR không bao giờ merge được. Đó là cái bẫy kinh điển của cặp
# `paths-ignore` + `required status check`.
#
# Nên PR nào cũng chạy — kể cả PR chỉ sửa .md. Đổi lại là ~3 phút runner cho
# một PR tài liệu; rẻ hơn nhiều so với một cổng merge hỏng âm thầm.
#
# `push` thì GIỮ `paths-ignore`: commit tài liệu đẩy thẳng lên main không cần
# chạy lại thứ PR đã kiểm.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:

# Push liên tiếp cùng một ref ⇒ huỷ run cũ, đỡ phút runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # PIN theo đúng toolchain đang dùng ở máy (2026-09-03):
  #   $ flutter --version
  #   Flutter 3.48.0-0.3.pre • channel main • Dart 3.13.0
  # pubspec yêu cầu `sdk: ^3.13.0-201.0.dev` nên KHÔNG hạ về stable tuỳ tiện:
  # stable có thể mang Dart cũ hơn → `flutter pub get` gãy ngay.
  FLUTTER_VERSION: "3.48.0-0.3.pre"
  FLUTTER_CHANNEL: "main"

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `sqlite3` (kho «Kho khám phá của SAM») dlopen "libsqlite3.so" lúc chạy;
      # ubuntu runner chỉ có sẵn libsqlite3.so.0, thiếu symlink .so →
      # test stories/discovery sẽ đỏ hàng loạt nếu không cài.
      - name: Cài native sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pubcache-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-

      - name: flutter pub get
        run: flutter pub get

      # NGƯỠNG MẶC ĐỊNH — không cờ nới lỏng nào. Local 2026-09-03:
      # «No issues found!». Nếu bước này đỏ vì lint: SỬA CODE, đừng thêm cờ.
      - name: flutter analyze
        run: flutter analyze

      # ⭐⭐ WAL-218 — SỔ GHI PHẢI SẠCH TRƯỚC KHI CHẠY.
      # Một bản ghi còn sót từ lần chạy trước (ở máy CÓ fixture) không được nói
      # thay cho lần chạy này. Trên runner thì thừa; ở máy thì đây chính là chỗ
      # «xanh giả» quay lại.
      - name: Reset Golden-chain ledger (WAL-218)
        run: rm -rf build/golden-chain build/golden-chain-verdict.json

      # Toàn bộ suite. Test cần corpus thật (lesson-index, pack bench) tự
      # markTestSkipped khi thiếu asset — corpus KHÔNG BAO GIỜ vào repo (WAL-43),
      # nên runner không có nó là đúng thiết kế, không phải thiếu sót.
      #
      # ⚠ NHƯNG «đúng thiết kế» KHÔNG có nghĩa là «đã kiểm chứng». Đo ngày
      # 2026-09-06 trên main (6fd728d): fixture CÓ ⇒ 1108 passed / 33 skipped;
      # fixture KHÔNG (đúng trạng thái runner này) ⇒ 1099 passed / 42 skipped.
      # Chín test rơi xuống, và DÒNG CUỐI CỦA SUITE GIỐNG HỆT NHAU ở cả hai lần:
      # «All tests passed!». Bước dưới đây tồn tại vì dòng ấy nói dối theo cách
      # không có test nào bắt được.
      - name: flutter test
        run: flutter test

      # ⭐⭐ WAL-218 — CI TỰ NÓI ĐỘ PHỦ CỦA MÌNH.
      # Chín khẳng định Golden chain ghi lại «đã kiểm» hay «UNVERIFIED vì vắng
      # fixture» vào build/golden-chain/. Bước này đọc sổ ấy, đối chiếu với
      # tool/ci/golden-chain-obligations.json, và in ra một khối độ phủ mà người
      # đọc KHÔNG thể nhầm 1099-passed thành đã kiểm chứng.
      #
      # `--min-obligations 9`: mẫu số có SÀN. Xoá một test ⇒ thiếu bản ghi ⇒ đỏ;
      # xoá luôn dòng nghĩa vụ ⇒ tụt dưới sàn ⇒ đỏ. Chín là con số ĐO ĐƯỢC, và
      # test/ci/golden_chain_registry_test.dart khoá sàn này lại với bản đăng ký.
      - name: Golden chain coverage (WAL-218)
        run: |
          python3 tool/ci/golden_chain_verdict.py \
            --min-obligations 9 \
            --out build/golden-chain-verdict.json

      # ⭐ VÀ CỔNG PHẢI CÒN SỐNG.
      # Một cổng xanh vì hình dạng đã đổi, chứ không vì tính chất còn đúng, thì
      # gần như vô giá trị — repo này đã bắt đúng chuyện đó hai lần. Nên ở đây
      # CI tự thử một lần: chạy verdict ở chế độ «lần chạy này KHẲNG ĐỊNH Golden
      # chain đã verified». Trên runner không có fixture (D4: không bao giờ có),
      # khẳng định ấy PHẢI ĐỎ. Nếu nó xanh, cổng đã chết và bước này đỏ thay.
      - name: Prove the Golden-claim gate is live (WAL-218)
        run: |
          set +e
          python3 tool/ci/golden_chain_verdict.py \
            --min-obligations 9 --require-verified >/dev/null 2>&1
          rc=$?
          set -e
          fixture="$(python3 -c "import json;print(json.load(open('tool/ci/golden-chain-obligations.json'))['fixture'])")"
          if [ -f "$fixture" ]; then
            want=0; what="fixture PRESENT => a Golden-verified claim must pass"
          else
            want=1; what="fixture ABSENT => a Golden-verified claim must FAIL"
          fi
          if [ "$rc" != "$want" ]; then
            echo "::error::Golden-claim gate is dead — $what, but exit was $rc"
            exit 1
          fi
          echo "Golden-claim gate live: $what (exit $rc)"

      # WAL-210 (audit G2/G3/G5): test Python cho tầng DỰNG PACK — gắn bài có
      # chặn (capped-toc-v1), cổng định danh bài, và provenance của pack.
      # Chỉ dữ liệu tổng hợp, không cần corpus. Đỏ ⇒ sửa code, không nới test.
      - name: Python pack-builder tests (tool/tests)
        run: python3 -m unittest discover -s tool/tests -v

      # Cổng «bản build mặc định»: pack trên máy CÓ pack phải mang provenance
      # đúng hash, KHÔNG experimental, KHÔNG có nguồn pattern-router*. Runner
      # không có corpus ⇒ không có pack ⇒ bỏ qua có chủ đích (không xanh giả:
      # bước in rõ là bỏ qua, và test Python ở trên vẫn chạy).
      - name: Pack provenance verify (only when packs exist)
        run: |
          if ls assets/pack/lesson-index-g*.json >/dev/null 2>&1; then
            python3 tool/ui/pack_provenance.py verify assets/pack/lesson-index-g*.json
          else
            echo "no lesson-index packs on this runner (corpus never enters the repo) — verify skipped"
          fi
